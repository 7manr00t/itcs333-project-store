<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Campus Marketplace</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/index.html">Campus Marketplace</a></h1>
    <nav>
      <a href="/catalog/index.html">Shop</a>
      <a href="/auth/login.html">Login</a>
    </nav>
  </header>
  <main>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <h2>Create an account</h2>
    <form id="register-form" class="box">
      <label for="username">Username</label>
      <input type="text" id="username" required maxlength="50">
      <label for="password">Password (min 6 characters)</label>
      <input type="password" id="password" required minlength="6">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" required>
      <button type="submit">Register</button>
      <p id="message" class="msg"></p>
    </form>
  </main>
  <script src="/app.js"></script>
  <script src="/auth/register.js"></script>
</body>
</html>
