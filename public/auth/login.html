<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Campus Marketplace</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/index.html">Campus Marketplace</a></h1>
    <nav>
      <a href="/catalog/index.html">Shop</a>
      <a href="/cart/index.html">Cart</a>
      <a href="/auth/register.html">Register</a>
    </nav>
  </header>
  <main>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <h2>Login</h2>
    <p id="who"></p>
    <button id="logout-btn" class="danger" style="display:none">Logout</button>
    <form id="login-form" class="box">
      <label for="username">Username</label>
      <input type="text" id="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <button type="submit">Login</button>
      <p id="message" class="msg"></p>
    </form>
  </main>
  <script src="/app.js"></script>
  <script src="/auth/login.js"></script>
</body>
</html>
